name: Deploy Frontend

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  APP_NAME: casino
  REMOTE_BASE_DIR: /srv/casino
  REMOTE_TMP_DIR: /tmp/casino-deploy/frontend
  REMOTE_ARCHIVE: casino-frontend.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Activate Yarn 4.9.1
        run: corepack prepare yarn@4.9.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Prepare frontend release
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_AUTH_URL: ${{ secrets.NEXT_PUBLIC_AUTH_URL }}
        run: |
          yarn deploy:prep
          tar -czf casino-frontend.tar.gz -C dist casino-frontend

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_HOST }}

      - name: Add known hosts (ssh-keyscan fallback)
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts || true

      - name: Upload frontend deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "frontend/deploy/deploy_frontend.sh"
          target: "${{ env.REMOTE_BASE_DIR }}"

      - name: Check frontend deploy prerequisites
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            chmod +x "${{ env.REMOTE_BASE_DIR }}/frontend/deploy/deploy_frontend.sh"
            if [ ! -f "${{ env.REMOTE_BASE_DIR }}/shared/frontend/env/frontend.env" ]; then
              echo "Missing frontend env file: ${{ env.REMOTE_BASE_DIR }}/shared/frontend/env/frontend.env" >&2
              exit 1
            fi
            unit_found=
            for p in /etc/systemd/system/casino-frontend.service /lib/systemd/system/casino-frontend.service /usr/lib/systemd/system/casino-frontend.service; do
              if [ -f "$p" ]; then unit_found=1; break; fi
            done
            if [ -z "$unit_found" ]; then
              echo "casino-frontend.service not found. Copy deploy/systemd/casino-frontend.service.example to /etc/systemd/system/casino-frontend.service, daemon-reload, enable." >&2
              exit 1
            fi

      - name: Copy frontend package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "frontend/${{ env.REMOTE_ARCHIVE }}"
          target: "${{ env.REMOTE_TMP_DIR }}"

      - name: Run frontend deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            ${{ env.REMOTE_BASE_DIR }}/frontend/deploy/deploy_frontend.sh ${{ env.REMOTE_TMP_DIR }}/frontend/${{ env.REMOTE_ARCHIVE }}
