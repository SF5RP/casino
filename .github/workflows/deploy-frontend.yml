name: Build and Deploy Frontend

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: "18"
  APP_NAME: "casino-frontend"

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run type checking
        working-directory: frontend
        run: |
          if npm run type-check 2>/dev/null; then
            echo "✅ Type check completed using npm script"
          else
            echo "📝 Running TypeScript check directly"
            npx tsc --noEmit
          fi

      - name: Build application
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.FRONTEND_API_URL || '/api' }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.FRONTEND_WS_URL || '/ws' }}
        run: npm run build

      - name: Prepare deployment package
        working-directory: frontend
        run: |
          set -e
          if [ ! -d ".next" ]; then
            echo "❌ .next directory not found! Build failed."
            exit 1
          fi
          mkdir -p deploy_package
          cp -r .next deploy_package/
          cp -r public deploy_package/ || mkdir -p deploy_package/public
          # Include runtime dependencies to avoid server-side install
          cp -r node_modules deploy_package/
          cp package.json package-lock.json next.config.ts deploy_package/
          # Create start-prod.js
          cat > deploy_package/start-prod.js << 'EOF'
          const { spawn } = require('child_process');
          console.log('🚀 Starting Next.js production server...');
          const port = process.env.PORT || 3000;
          const nextApp = spawn('npx', ['next', 'start', '-p', String(port), '-H', '0.0.0.0'], {
            stdio: 'inherit',
            env: { ...process.env, NODE_ENV: 'production', PORT: port },
            shell: true
          });
          nextApp.on('close', (code) => { console.log('Next.js process exited with code ' + code); process.exit(code); });
          process.on('SIGINT', () => { console.log('Received SIGINT, stopping Next.js...'); nextApp.kill('SIGINT'); });
          process.on('SIGTERM', () => { console.log('Received SIGTERM, stopping Next.js...'); nextApp.kill('SIGTERM'); });
          EOF
          # Create PM2 ecosystem template
          cat > deploy_package/ecosystem.config.template.js << 'EOF'
          module.exports = {
            apps: [{
              name: 'casino-frontend',
              script: 'start-prod.js',
              instances: 1,
              exec_mode: 'fork',
              env: {
                PORT: process.env.PORT || 3000,
                NEXT_PUBLIC_API_URL: process.env.NEXT_PUBLIC_API_URL || '/api',
                NEXT_PUBLIC_WS_URL: process.env.NEXT_PUBLIC_WS_URL || '/ws',
                NEXT_PUBLIC_WS_PROTOCOL: process.env.NEXT_PUBLIC_WS_PROTOCOL || 'ws',
                NEXT_PUBLIC_APP_ENV: process.env.NEXT_PUBLIC_APP_ENV || 'production'
              },
              error_file: '/var/log/pm2/casino-frontend-error.log',
              out_file: '/var/log/pm2/casino-frontend-out.log',
              log_file: '/var/log/pm2/casino-frontend-combined.log',
              time: true,
              max_restarts: 3,
              min_uptime: '10s',
              max_memory_restart: '1G',
              restart_delay: 4000
            }]
          };
          EOF
          # Create tarball
          tar -czf casino-frontend-deploy.tar.gz -C deploy_package .

      - name: Upload build artifact (tarball)
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/casino-frontend-deploy.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder"

      - name: Deploy and restart frontend
        env:
          DEPLOY_PORT: ${{ secrets.FRONTEND_PORT || '3000' }}
        run: |
          echo "🚀 Deploying frontend to production environment..."
          echo "📍 Server: ${{ secrets.SERVER_HOST }}"
          echo "👤 User: ${{ secrets.SERVER_USER }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"

          # Transfer pre-built tarball
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT || '22' }} \
              casino-frontend-deploy.tar.gz \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/

          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || '22' }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "export PORT=${DEPLOY_PORT}; bash -s" << 'EOF'
          set -e

          echo "🔄 Stopping frontend service..."
          if pm2 list | grep -q "casino-frontend"; then
            pm2 stop casino-frontend || true
            pm2 delete casino-frontend || true
          else
            echo "Process casino-frontend not found, skipping stop"
          fi

          echo "📦 Extracting deployment package..."
          rm -rf casino-frontend-backup
          if [ -d "casino-frontend" ]; then
            mv casino-frontend casino-frontend-backup
          fi

          mkdir -p casino-frontend
          tar -xzf casino-frontend-deploy.tar.gz -C casino-frontend

          echo "📁 Setting up frontend directory..."
          cd casino-frontend

          if [ ! -d ".next" ]; then
            echo "❌ ERROR: .next directory not found after extraction!"
            ls -la
            exit 1
          fi
          echo "✅ .next directory verified on server"

          cp ecosystem.config.template.js ecosystem.config.js || true
          sudo mkdir -p /var/log/pm2
          sudo chown -R $USER:$USER /var/log/pm2

          echo "🚀 Starting frontend service on port ${PORT}..."
          PORT="${PORT}" pm2 start ecosystem.config.js --update-env
          pm2 save

          echo "✅ Verifying deployment..."
          sleep 15
          if pm2 list | grep -q "casino-frontend.*online"; then
            echo "✅ Frontend deployment successful!"
          else
            echo "❌ Frontend deployment failed!"
            pm2 logs casino-frontend --lines 50
            exit 1
          fi

          rm -f ~/casino-frontend-deploy.tar.gz
          EOF

      - name: Health check (remote)
        env:
          DEPLOY_PORT: ${{ secrets.FRONTEND_PORT || '3000' }}
        run: |
          echo "🏥 Running frontend health check on the server..."
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || '22' }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "ATTEMPTS=10; for i in $(seq 1 $ATTEMPTS); do if curl -fsS -m 10 http://127.0.0.1:${DEPLOY_PORT}/ >/dev/null; then echo '✅ Remote HTTP health check passed'; exit 0; fi; echo '⏳ Waiting for app to become ready ('$i'/'$ATTEMPTS')...'; sleep 5; done; echo '❌ Remote HTTP health check failed after '$ATTEMPTS' attempts'; pm2 logs casino-frontend --lines 50 || true; exit 1"

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_PORT: ${{ secrets.FRONTEND_PORT || '3000' }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🚀 Frontend deployment completed successfully!"
            echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: ${{ inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: http://${{ secrets.SERVER_HOST }}:${DEPLOY_PORT}" >> $GITHUB_STEP_SUMMARY
          else
            echo "💥 Frontend deployment failed!"
            echo "## 💥 Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: ${{ inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
