name: Deploy Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  APP_NAME: casino
  REMOTE_BASE_DIR: /srv/casino
  REMOTE_TMP_DIR: /tmp/casino-deploy/backend
  REMOTE_ARCHIVE: casino-backend.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare backend release
        working-directory: backend
        run: |
          make deploy-prep
          tar -czf casino-backend.tar.gz -C dist casino-backend

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_HOST }}

      - name: Upload backend deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/deploy/deploy_backend.sh"
          target: "${{ env.REMOTE_BASE_DIR }}"

      - name: Check backend deploy prerequisites
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            chmod +x "${{ env.REMOTE_BASE_DIR }}/backend/deploy/deploy_backend.sh"
            if [ ! -f "${{ env.REMOTE_BASE_DIR }}/shared/backend/env/backend.env" ]; then
              echo "Missing backend env file: ${{ env.REMOTE_BASE_DIR }}/shared/backend/env/backend.env" >&2
              exit 1
            fi
            if ! sudo -n systemctl status casino-backend >/dev/null 2>&1; then
              echo "Missing passwordless sudo for systemctl on casino-backend" >&2
              exit 1
            fi

      - name: Copy backend package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/${{ env.REMOTE_ARCHIVE }}"
          target: "${{ env.REMOTE_TMP_DIR }}"

      - name: Run backend deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            ${{ env.REMOTE_BASE_DIR }}/backend/deploy/deploy_backend.sh ${{ env.REMOTE_TMP_DIR }}/backend/${{ env.REMOTE_ARCHIVE }}
