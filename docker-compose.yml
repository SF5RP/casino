services:
  postgres:
    image: postgres:16-alpine
    container_name: casino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casino_db}
      POSTGRES_USER: ${POSTGRES_USER:-casino_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casino_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casino_user} -d ${POSTGRES_DB:-casino_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casino-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-casino_db}
      DB_USER: ${POSTGRES_USER:-casino_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-casino_password}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      API_KEY: ${API_KEY:-local-dev-api-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 8011
      GRPC_PORT: 8012
    command: ["./casino-server", "migrate"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casino-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-casino_db}
      DB_USER: ${POSTGRES_USER:-casino_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-casino_password}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      API_KEY: ${API_KEY:-local-dev-api-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 8011
      GRPC_PORT: 8012
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8000}
    ports:
      - "8011:8011"
      - "8012:8012"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8011/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8011/ws}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:8000}
    container_name: casino-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8011/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8011/ws}
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
